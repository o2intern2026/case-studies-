<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Calibri, Arial, sans-serif" font-size="22">
  <rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF8F2"/>

  <g id="kicker" data-pptx-bounds="64 58 500 26">
    <text x="64" y="72" font-size="16" font-weight="bold" letter-spacing="2" fill="#003657">FEE REDUCTION IMPACT</text>
    <line x1="64" y1="82" x2="120" y2="82" stroke="#BC9E60" stroke-width="2"/>
  </g>

  <g id="title" data-pptx-bounds="64 90 1152 48">
    <text x="64" y="124" font-family="Cambria, Georgia, serif" font-size="40" font-weight="bold" fill="#003657">The fee cut adds $6.55m to OPERF's modeled NPV</text>
  </g>

  <g id="setup-line" data-pptx-bounds="64 180 1152 40">
    <text x="64" y="206" fill="#1E1E1E">Management fee <tspan font-weight="bold" fill="#003657">1.50% → 1.35%</tspan>, with all other assumptions held constant.</text>
  </g>

  <g id="operf-npv-dumbbell" data-pptx-bounds="64 240 1152 220">
    <g id="operf-npv-dumbbell-chartArea">
      <!-- chart-plot-area: object=operf-npv-dumbbell | 120,280,1160,400 -->
      <g id="operf-npv-dumbbell-axis" stroke="#5C6670" stroke-width="1.5">
        <line x1="120" y1="360" x2="1160" y2="360"/>
      </g>
      <g stroke="#5C6670" stroke-width="1">
        <line x1="120" y1="360" x2="120" y2="368"/>
        <line x1="250" y1="360" x2="250" y2="368"/>
        <line x1="380" y1="360" x2="380" y2="368"/>
        <line x1="510" y1="360" x2="510" y2="368"/>
        <line x1="640" y1="360" x2="640" y2="368"/>
        <line x1="770" y1="360" x2="770" y2="368"/>
        <line x1="900" y1="360" x2="900" y2="368"/>
        <line x1="1030" y1="360" x2="1030" y2="368"/>
        <line x1="1160" y1="360" x2="1160" y2="368"/>
      </g>
      <g font-size="14" fill="#5C6670" text-anchor="middle">
        <text x="120" y="386">0</text>
        <text x="250" y="386">4</text>
        <text x="380" y="386">8</text>
        <text x="510" y="386">12</text>
        <text x="640" y="386">16</text>
        <text x="770" y="386">20</text>
        <text x="900" y="386">24</text>
        <text x="1030" y="386">28</text>
        <text x="1160" y="386">32</text>
      </g>
      <text x="1160" y="412" font-size="14" fill="#5C6670" text-anchor="end">OPERF NPV at 15%, $m</text>
      <line x1="824.7" y1="360" x2="1037.7" y2="360" stroke="#003657" stroke-width="6"/>
      <circle cx="824.7" cy="360" r="12" fill="#FBF8F2" stroke="#003657" stroke-width="3"/>
      <circle cx="1037.7" cy="360" r="12" fill="#0055FF"/>
      <text x="824.7" y="412" font-size="18" fill="#003657" text-anchor="middle">1.50% fee · $21.68m</text>
      <text x="1037.7" y="326" font-size="18" font-weight="bold" fill="#0055FF" text-anchor="middle">1.35% fee · $28.24m</text>
      <text x="931" y="296" font-size="26" font-weight="bold" fill="#003657" text-anchor="middle">+$6.55m NPV</text>
    </g>
  </g>

  <g id="irr-and-savings" data-pptx-bounds="64 480 1152 60">
    <text x="64" y="504" fill="#003657">LP IRR 15.72% → 15.94%, about +21 bps.</text>
    <text x="64" y="534" font-size="18" fill="#5C6670">Nominal fee saving $1.125m per year, $11.25m over ten years (OPERF share 750 ÷ 20,000 = 3.75%) — not the same measure as NPV.</text>
  </g>

  <g id="valuation-caption" data-pptx-bounds="64 560 1152 56">
    <text x="64" y="584" font-size="18" fill="#5C6670">NPV at model inception; 15% assumed discount rate. Fee saving amounts are nominal.</text>
    <text x="64" y="610" font-size="18" fill="#5C6670">Ten-year inception-model comparison; not a valuation of the remaining investment in December 2008.</text>
  </g>

  <g id="footer" data-pptx-bounds="64 668 1152 36">
    <text x="64" y="688" font-size="14" fill="#5C6670">Source: Q4 Analysis!C17:C21, C25, C28; Q3 Base case!C64; Q4 Fee cut!C64. The gain uses full precision (6.5536), not the rounded difference 28.24 − 21.68 = 6.56.</text>
    <text x="1216" y="697" font-size="14" fill="#5C6670" text-anchor="end">33</text>
  </g>
</svg>
