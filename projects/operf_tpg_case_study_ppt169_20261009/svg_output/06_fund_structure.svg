  <g id="flow-key" data-pptx-bounds="880 220 336 400">
    <line x1="880" y1="220" x2="880" y2="620" stroke="#D6CFC2" stroke-width="1" />
    <text x="900" y="248" font-weight="bold" fill="#003657">Flows</text>
    <line x1="900" y1="283" x2="940" y2="283" stroke="#003657" stroke-width="2" stroke-dasharray="8,4" />
    <text x="952" y="288" font-size="18" font-weight="bold" fill="#003657">Management</text>
    <text x="900" y="316" font-size="18" fill="#1E1E1E">1  Investment selection and<tspan x="900" dy="22">management</tspan></text>
    <line x1="900" y1="355" x2="940" y2="355" stroke="#003657" stroke-width="2" />
    <text x="952" y="360" font-size="18" font-weight="bold" fill="#003657">Capital and proceeds</text>
    <text x="900" y="388" font-size="18" fill="#1E1E1E">2  GP capital when called<tspan x="900" dy="28">3  Capital paid when called</tspan><tspan x="900" dy="28">4  Investment capital / ownership</tspan></text>
    <text x="900" y="472" font-size="18" fill="#5C6670">5  Proceeds if realised<tspan x="900" dy="28">6  Fund distributions</tspan><tspan x="900" dy="28">7  Return on GP capital</tspan></text>
    <line x1="900" y1="567" x2="940" y2="567" stroke="#BC9E60" stroke-width="2" />
    <text x="952" y="572" font-size="18" font-weight="bold" fill="#003657">Compensation</text>
    <text x="900" y="600" font-size="18" fill="#1E1E1E">8  Fees / conditional carry</text>
  </g>

  <g id="footer" data-pptx-bounds="64 668 1152 36" fill="#5C6670" font-size="14">
    <text x="64" y="680">Source: Case pp. 3–5; Washington Mutual, Inc. Form 8-K (11 Apr 2008); Metrick &amp; Yasuda (2007). "TPG" is shorthand for the GP and management<tspan x="64" dy="17">entities; return arrows show the mechanism, not realised gains.</tspan></text>
    <text x="1216" y="697" text-anchor="end">6</text>
  </g>
