      <line x1="530" y1="276" x2="530" y2="402" stroke="#003657" marker-end="url(#arrow-navy)" />
      <line x1="590" y1="404" x2="590" y2="278" stroke="#8AA3B6" marker-end="url(#arrow-tint)" />
      <line x1="650" y1="404" x2="650" y2="278" stroke="#BC9E60" marker-end="url(#arrow-gold)" />

