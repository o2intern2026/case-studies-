      <rect x="390" y="404" width="300" height="52" fill="#003657" />
      <text x="540" y="428" font-weight="bold" fill="#FBF8F2" text-anchor="middle">TPG VI</text>
      <text x="540" y="448" font-size="16" fill="#D6CFC2" text-anchor="middle">the fund (directly or through vehicles)</text>

      <rect x="64" y="380" width="200" height="48" fill="#F1ECE2" />
      <text x="164" y="404" font-weight="bold" fill="#003657" text-anchor="middle">OPERF</text>
      <text x="164" y="422" font-size="16" fill="#5C6670" text-anchor="middle">limited partner</text>

      <rect x="64" y="452" width="200" height="48" fill="#F1ECE2" />
      <text x="164" y="476" font-weight="bold" fill="#003657" text-anchor="middle">Other LPs</text>
