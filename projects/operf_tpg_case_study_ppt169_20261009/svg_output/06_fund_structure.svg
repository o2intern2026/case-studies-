        <circle cx="550" cy="340" r="11" />
        <circle cx="610" cy="340" r="11" />
        <circle cx="670" cy="340" r="11" />
        <circle cx="300" cy="384" r="11" />
        <circle cx="300" cy="436" r="11" />
        <circle cx="430" cy="508" r="11" />
        <circle cx="510" cy="508" r="11" />
        <circle cx="620" cy="508" r="11" />
        <circle cx="700" cy="508" r="11" />
