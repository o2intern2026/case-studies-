  <g id="caveats" data-pptx-bounds="800 252 416 360">
    <text x="800" y="274" font-size="16" font-weight="bold" letter-spacing="2" fill="#003657">READING THE EXHIBIT</text>
    <line x1="800" y1="284" x2="856" y2="284" stroke="#BC9E60" stroke-width="2" />
    <text font-size="18" fill="#1E1E1E" x="800" y="316"><tspan font-weight="bold">Case-reported IRRs: </tspan>Fund I 36.3%;</text><text font-size="18" fill="#1E1E1E" x="800" y="340">Fund III 24.5%; Fund V −16.7%. Fund VI IRR</text><text font-size="18" fill="#1E1E1E" x="800" y="364">is not meaningful in the exhibit.</text><text font-size="18" fill="#1E1E1E" x="800" y="408"><tspan font-weight="bold">About 27% cumulative IRR </tspan>for OPERF's TPG</text><text font-size="18" fill="#1E1E1E" x="800" y="432">investments is not a return earned every year</text><text font-size="18" fill="#1E1E1E" x="800" y="456">and not a forecast for Fund VI.</text><text font-size="18" fill="#1E1E1E" x="800" y="500"><tspan font-weight="bold">Limits on comparison: </tspan>different fund ages</text><text font-size="18" fill="#1E1E1E" x="800" y="524">and unrealised values limit direct comparisons.</text><text font-size="18" fill="#1E1E1E" x="800" y="548">Early VI losses warrant scrutiny without</text><text font-size="18" fill="#1E1E1E" x="800" y="572">determining the return on remaining investments.</text></g>

  <g id="chart-footer" data-pptx-bounds="64 622 1152 30">
    <text x="64" y="640" font-size="14" font-style="italic" fill="#5C6670">TVPI = (distributed + fair value) ÷ contributed. Values from the case exhibit as of the decision date; fund vintages run from 1994 (Fund I) to 2008 (Fund VI).</text>
  </g>

