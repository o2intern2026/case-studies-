<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Calibri, Arial, sans-serif" font-size="22">
  <rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF8F2" />

  <g id="kicker" data-pptx-bounds="64 58 700 26">
    <text x="64" y="72" font-size="16" font-weight="bold" letter-spacing="2" fill="#003657">FINAL RECOMMENDATION · NEGOTIATION APPROACH</text>
    <line x1="64" y1="82" x2="120" y2="82" stroke="#BC9E60" stroke-width="2" />
  </g>

  <g id="title" data-pptx-bounds="64 90 1152 96">
    <text font-size="40" fill="#003657" font-family="Cambria, Georgia, serif" font-weight="bold" x="64" y="124">Negotiate now, using evidence</text><text font-size="40" fill="#003657" font-family="Cambria, Georgia, serif" font-weight="bold" x="64" y="172">available in December 2008</text></g>

  <g id="lead" data-pptx-bounds="64 186 1152 64">
    <text fill="#003657" x="64" y="206">TPG's voluntary concessions create an opening for discussion;</text><text fill="#003657" x="64" y="236">existing commitments limit OPERF's unilateral leverage.</text></g>

  <g id="context" data-pptx-bounds="64 266 440 340">
    <text x="64" y="284" font-size="16" font-weight="bold" letter-spacing="2" fill="#003657">CONTEXT AT THE DECISION DATE</text>
    <line x1="64" y1="294" x2="120" y2="294" stroke="#BC9E60" stroke-width="2" />
    <text font-size="18" fill="#1E1E1E" x="64" y="324" font-weight="bold">Federal Reserve, 16 December 2008: </text><text font-size="18" fill="#1E1E1E" x="64" y="348">the statement reports deteriorating activity and</text><text font-size="18" fill="#1E1E1E" x="64" y="372">tight credit while announcing substantial support;</text><text font-size="18" fill="#1E1E1E" x="64" y="396">the direction and timing of recovery are unknown.</text><text font-size="18" fill="#1E1E1E" x="64" y="444" font-weight="bold">Apollo filing, April 2008: </text><text font-size="18" fill="#1E1E1E" x="64" y="468">describes an 8% preferred return with catch-up,</text><text font-size="18" fill="#1E1E1E" x="64" y="492">management-fee offsets and clawback provisions.</text><text font-size="16" fill="#5C6670" x="64" y="540">These are examples available at the decision date,</text><text font-size="16" fill="#5C6670" x="64" y="560">not proof that OPERF can secure identical terms.</text></g>

  <g id="sequence-rule" data-pptx-bounds="543 266 2 346">
    <line x1="544" y1="266" x2="544" y2="612" stroke="#D6CFC2" stroke-width="2" />
  </g>

  <g id="sequence" data-pptx-bounds="560 266 656 346">
    <text x="560" y="284" font-size="16" font-weight="bold" letter-spacing="2" fill="#003657">FIVE STEPS</text>
    <line x1="560" y1="294" x2="616" y2="294" stroke="#BC9E60" stroke-width="2" />
    <g id="steps" font-size="18" fill="#1E1E1E">
      <g id="step-1">
        <text x="560" y="332" font-family="Cambria, Georgia, serif" font-size="26" font-weight="bold" fill="#BC9E60">1</text>
        <text x="600" y="332">Accept the fee reduction available to all LPs.</text>
      </g>
      <g id="step-2">
        <text x="560" y="388" font-family="Cambria, Georgia, serif" font-size="26" font-weight="bold" fill="#BC9E60">2</text>
        <text x="600" y="388">Evaluate commitment size independently of that common concession.</text>
      </g>
      <g id="step-3">
        <text x="560" y="444" font-family="Cambria, Georgia, serif" font-size="26" font-weight="bold" fill="#BC9E60">3</text>
        <text x="600" y="444">Check TPG VI's actual LPA and amendment requirements.</text>
      </g>
      <g id="step-4">
        <text x="560" y="500" font-family="Cambria, Georgia, serif" font-size="26" font-weight="bold" fill="#BC9E60">4</text>
        <text x="600" y="500">Preserve or seek 8% protection; request A first, pursue B if A is refused,</text><text x="600" y="524">then the standard hurdle fallback where missing.</text></g>
      <g id="step-5">
        <text x="560" y="580" font-family="Cambria, Georgia, serif" font-size="26" font-weight="bold" fill="#BC9E60">5</text>
        <text x="600" y="580">Use future commitments as additional negotiating opportunities</text><text x="600" y="604">without promising them now.</text></g>
    </g>
  </g>

  <g id="relationship-line" data-pptx-bounds="64 616 1152 40">
    <line x1="64" y1="618" x2="1216" y2="618" stroke="#D6CFC2" stroke-width="1" />
    <text x="64" y="644" font-size="18" fill="#003657">Preserve a constructive relationship whether retaining or accepting TPG's offered reduction; a reducing LP is not abandoning the manager.</text>
  </g>

  <g id="footer" data-pptx-bounds="64 668 1152 36" fill="#5C6670" font-size="14">
    <text x="64" y="680">Source: Case pp. 1, 6; Federal Reserve FOMC statement, 16 Dec 2008; Apollo Global Management Form S-1, 8 Apr 2008. Later material (2009 ILPA principles, the March 2009</text><text x="64" y="697">TPG write-down, later surveys) is excluded.</text><text x="1216" y="697" text-anchor="end">52</text>
  </g>
</svg>